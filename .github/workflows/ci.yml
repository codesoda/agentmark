name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4

      # Build the extension first so include_dir! embeds real files
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/extension/package-lock.json

      - name: Build extension
        run: npm ci && npm run build
        working-directory: packages/extension

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

  app:
    name: Desktop app checks
    # Tauri on Linux needs WebKitGTK; the app ships for macOS, so it is checked there.
    runs-on: macos-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            packages/extension/package-lock.json
            packages/app/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: packages/app

      - name: Typecheck
        run: npm run typecheck
        working-directory: packages/app

      - name: Lint
        run: npm run lint
        working-directory: packages/app

      - name: Test
        run: npm run test
        working-directory: packages/app

      - name: Build frontend
        run: npm run build
        working-directory: packages/app

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -p agentmark-app --check

      - name: Clippy
        run: cargo clippy -p agentmark-app --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test -p agentmark-app

      - name: Debug app bundle (with the CLI sidecar)
        run: sh scripts/build-app.sh --debug
        working-directory: packages/app

      - name: Check the bundled CLI runs
        run: |
          app=target/debug/bundle/macos/AgentMark.app
          test -x "$app/Contents/MacOS/agentmark-app"
          "$app/Contents/MacOS/agentmark" --version

  skill:
    name: Skill lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint SKILL.md files
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: sh packages/skill/lint.sh

  extension:
    name: Extension checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if extension package exists
        id: check
        run: |
          if [ -f packages/extension/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "packages/extension not found — skipping extension checks"
          fi

      - name: Setup Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/extension/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: npm ci
        working-directory: packages/extension

      - name: Typecheck
        if: steps.check.outputs.exists == 'true'
        run: npm run typecheck
        working-directory: packages/extension

      - name: Build
        if: steps.check.outputs.exists == 'true'
        run: npm run build
        working-directory: packages/extension

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: npm run lint
        working-directory: packages/extension

      - name: Test
        if: steps.check.outputs.exists == 'true'
        run: npm run test
        working-directory: packages/extension

  web:
    name: Website checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
