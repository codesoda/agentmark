<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>compose</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px; height: 800px; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
    color: #111827;
    position: relative;
  }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600; color: #312e81; margin-bottom: 28px; }
  h1 { font-size: 40px; line-height: 1.15; margin: 0 0 18px; font-weight: 700; letter-spacing: -0.01em; }
  p { font-size: 20px; line-height: 1.5; margin: 0; color: #374151; }
  .stage { position: absolute; top: 0; bottom: 0; right: 64px; display: flex; gap: 28px; align-items: center; }
  .card { background: #fff; border-radius: 14px; box-shadow: 0 24px 60px rgba(30, 27, 75, 0.22), 0 2px 6px rgba(30, 27, 75, 0.08); overflow: hidden; position: relative; }
  .card iframe { border: 0; position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #fff; }
</style>
</head>
<body>
<div class="copy">
  <div class="brand">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="1.5 1.5 21 21" width="32" height="32"><rect x="1.5" y="1.5" width="21" height="21" rx="2.784" fill="#4F46E5"/><path d="M9.057 5.795H14.943A1.67 1.67 0 0 1 16.614 7.466V17.695Q16.614 18.205 16.105 18.205H15.834Q15.58 18.205 15.401 18.026L12 14.625L8.599 18.026Q8.42 18.205 8.166 18.205H7.895Q7.386 18.205 7.386 17.695V7.466A1.67 1.67 0 0 1 9.057 5.795Z" fill="#fff"/><path d="M12 8.86V11.56M10.65 10.21H13.35" stroke="#4F46E5" stroke-width="1.3" stroke-linecap="round" fill="none"/></svg>
    AgentMark
  </div>
  <h1 id="h"></h1>
  <p id="p"></p>
</div>
<div class="stage" id="stage"></div>
<script>
const shot = new URLSearchParams(location.search).get("shot") || "1";

// Each frame: harness screen, CSS width/height of the extension page, scale, visible height, scroll, actions.
const SHOTS = {
  "1": {
    h: "Save the page you are on",
    p: "Click the toolbar icon or press \u2318\u21e7S (Ctrl+Shift+S on Linux). AgentMark saves the page into a folder on your computer. Add tags, a collection or a note if you like.",
    col: true,
    frames: [
      { s: "ready", w: 320, h: 122, scale: 1.4 },
      { s: "ready", w: 320, h: 352, scale: 1.4, click: "More options" },
    ],
  },
  "2": {
    h: "Find it again in the side panel",
    p: "Browse what you saved, read the summary, and edit tags, notes and collections. Press \u2318\u21e7B to open it.",
    frames: [
      { s: "sp-ready", w: 380, h: 620, scale: 1.0 },
      { s: "sp-ready", w: 380, h: 620, scale: 1.0, click: "Plain text outlives every app" },
    ],
  },
  "3": {
    h: "Walks you through installing the app",
    p: "The extension needs the AgentMark app on your computer. If it is missing, the extension shows how to install it for your platform and waits for it.",
    frames: [
      { s: "a-mac", w: 320, h: 470, scale: 1.15 },
      { s: "a-mac", w: 320, h: 470, scale: 1.15, click: "Mac Apple Silicon" },
    ],
  },
  "4": {
    h: "Two choices and you are done",
    p: "Pick the folder for your bookmarks and the agent that writes summaries. Summaries are optional; the page text goes to your own agent's provider only when they are on.",
    frames: [{ s: "c-setup", w: 320, h: 586, scale: 1.18 }],
  },
  "5": {
    h: "Settings stay in the side panel",
    p: "Change the folder, the agent and the sites AgentMark captures from your browser. Marking saved pages on every site is optional and off by default.",
    frames: [
      { s: "d-settings", w: 380, h: 620, scale: 1.0 },
      { s: "d-settings", w: 380, h: 620, scale: 1.0, scroll: 560 },
    ],
  },
};

const cfg = SHOTS[shot];
document.getElementById("h").textContent = cfg.h;
document.getElementById("p").textContent = cfg.p;
const stage = document.getElementById("stage");
if (cfg.frames.length > 1 && !cfg.col) {
  const copy = document.querySelector(".copy");
  const used = cfg.frames.reduce((a, f) => a + Math.round(f.w * f.scale), 0) + 28 * (cfg.frames.length - 1) + 64;
  copy.style.left = "64px";
  copy.style.width = (1280 - used - 64 - 48) + "px";
  document.getElementById("h").style.fontSize = "34px";
  document.getElementById("p").style.fontSize = "18px";
}
if (cfg.col) { stage.style.flexDirection = "column"; stage.style.justifyContent = "center"; stage.style.alignItems = "flex-end"; }
window.__ready = 0;

function findByText(doc, text) {
  const els = doc.querySelectorAll("button, a, h2, h3, div, span, p");
  for (const el of els) {
    if (el.children.length === 0 && el.textContent.trim() === text) return el.closest("button, a, [role=button]") || el;
  }
  for (const el of doc.querySelectorAll("button, a, [role=button]")) {
    if (el.textContent.includes(text)) return el;
  }
  return null;
}

for (const f of cfg.frames) {
  const card = document.createElement("div");
  card.className = "card";
  card.style.width = Math.round(f.w * f.scale) + "px";
  card.style.height = Math.round(f.h * f.scale) + "px";
  const iframe = document.createElement("iframe");
  iframe.src = "/index.html?s=" + encodeURIComponent(f.s);
  iframe.style.width = f.w + "px";
  iframe.style.height = (f.h + (f.scroll || 0)) + "px";
  iframe.style.transform = `scale(${f.scale})` + (f.scroll ? ` translateY(-${f.scroll}px)` : "");
  card.appendChild(iframe);
  stage.appendChild(card);
  iframe.addEventListener("load", () => {
    const doc = iframe.contentDocument;
    let tries = 0;
    const tick = () => {
      tries++;
      if (f.click) {
        const el = findByText(doc, f.click);
        if (!el) { if (tries < 100) return setTimeout(tick, 100); }
        else { el.click(); }
      }
      setTimeout(() => { window.__ready++; }, 800);
    };
    setTimeout(tick, 300);
  });
}
</script>
</body>
</html>
