[package]
name = "agentmark-app"
version = "0.3.1"
edition = "2021"
description = "AgentMark desktop app: installs the CLI, registers with Chrome, and runs setup."
publish = false

[lib]
# The Tauri entry point lives in the library so the binary is a thin launcher.
name = "agentmark_app"
path = "src/lib.rs"

[[bin]]
# Must differ from the `agentmark` sidecar: both live in Contents/MacOS/.
name = "agentmark-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agentmark = { path = "../../cli" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tracing = "0.1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"
